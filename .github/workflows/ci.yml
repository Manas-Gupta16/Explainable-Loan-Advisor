name: Explainable Loan Advisor CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-ml-ci:
    name: Backend & ML Engine CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (OpenMP for XGBoost / SHAP)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Verify ML Engine Model Training
        env:
          PYTHONPATH: .
        run: |
          python -m ml_engine.train

      - name: Run Test Suite (Pytest)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

  frontend-ci:
    name: Frontend Application CI (Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Build Vite Production Package
        working-directory: ./frontend
        run: |
          npm run build
